name = "armagedon-api"
main = "src/index.js"
compatibility_date = "2026-03-29"

[[d1_databases]]
binding = "DB"
database_name = "armagedon"
database_id = "78995a50-1521-453e-b0c1-2b1b8b19f260"

[[durable_objects.bindings]]
name = "MESA_REALTIME"
class_name = "MesaRealtimeRoom"

[[migrations]]
tag = "v1-mesa-realtime"
new_sqlite_classes = [ "MesaRealtimeRoom" ]

[[r2_buckets]]
binding  = "MAPS"
bucket_name = "armagedom-maps"

[vars]
MASTER_BOOTSTRAP_USERNAME = "mestre"
# Tempo de expiração dos mapas no R2 em segundos (padrão: 12 horas).
# Mapas são deletados ativamente quando jogadores saem, mas este valor
# serve como segurança extra caso o Worker reinicie inesperadamente.
MAP_R2_TTL = "43200"
