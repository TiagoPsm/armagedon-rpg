name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts pula os postinstall pesados (sharp/playwright), que
      # o build estatico nao usa; terser e clean-css sao JS puro.
      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Install browser for published bundle regression
        run: npx playwright install --with-deps chromium

      - name: Verify source contracts and static integrity
        run: |
          npm run check:js
          npm run audit:static
          npm run audit:css
          npm run audit:pendencias
          npm run test:mesa:vision
          node --test tests/css-syntax.test.cjs

      - name: Verify published bundle initialization
        run: npx playwright test tests/build-pages.spec.cjs --workers=1

      # build = build:pages (bundle) + minify (terser + clean-css)
      - name: Prepare static site
        run: npm run build

      - name: Verify actual minified interface and corrected flows
        env:
          MESA_TEST_ARTIFACT: "1"
        run: npx playwright test tests/project-ui-audit.spec.cjs tests/mesa-map-library.spec.cjs tests/mesa-templates.spec.cjs tests/mesa-lighting.spec.cjs tests/production- --workers=1

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
