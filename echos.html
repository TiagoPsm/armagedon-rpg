<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Armagedom | Echos</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2026-04-19-logo-fallback-3" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2026-04-19-logo-fallback-3" />
  <link rel="shortcut icon" href="favicon.ico?v=2026-04-19-logo-fallback-3" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2026-04-19-logo-fallback-3" />
  <link rel="dns-prefetch" href="//armagedon-api.tiagopsm2008.workers.dev" />
  <link rel="preconnect" href="https://armagedon-api.tiagopsm2008.workers.dev" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/tokens.css?v=2026-06-14-echos-1" />
  <link rel="stylesheet" href="css/reset.css?v=2026-06-12-cache-fix-1" />
  <link rel="stylesheet" href="css/components.css?v=2026-06-12-modal-stack-1" />
  <link rel="stylesheet" href="css/echos.css?v=2026-06-14-echos-1" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap"></noscript>
</head>
<body class="echos-page">
  <div class="bg-fixed bg-noise"></div>
  <div class="bg-fixed bg-vignette"></div>
  <div class="bg-fixed bg-blackfire"></div>
  <div class="bg-fixed bg-cinders"></div>

  <header class="site-header">
    <div class="shell header-shell">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <picture>
            <source srcset="logo-rpg-site.webp?v=2026-05-20-opt-1" type="image/webp">
            <img src="logo-rpg-site.jpg?v=2026-05-20-opt-1" alt="" class="site-logo-img" width="256" height="256" decoding="async" onerror="if(!this.dataset.fallbackStep){this.dataset.fallbackStep='1';this.src='logo-rpg-armagedon.png?v=2026-06-14-opt-2';}else if(this.dataset.fallbackStep==='1'){this.dataset.fallbackStep='2';this.src='Logo%20app.jpg?v=2026-05-20-opt-1';}else{this.onerror=null;}" />
          </picture>
        </span>
        <span class="brand-copy">
          <strong>Armagedom</strong>
          <small id="echosHeaderRole">Echos</small>
        </span>
      </div>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html" class="nav-link">Início</a>
        <a href="ficha.html" class="nav-link">Fichas</a>
        <a href="mesa.html" class="nav-link">Mesa</a>
        <a href="regras.html" class="nav-link">Regras</a>
        <a href="sugestoes.html" class="nav-link">Sugestões</a>
      </nav>

      <div class="header-actions">
        <span class="header-user" id="echosUser"></span>
        <button type="button" class="btn btn-ghost btn-small" onclick="handleLogout()">Sair</button>
      </div>
    </div>
  </header>
  <script>(function(){try{var s=JSON.parse(localStorage.getItem('tc_session'));if(s&&s.username){var u=document.getElementById('echosUser');if(u)u.textContent=s.username;var r=document.getElementById('echosHeaderRole');if(r)r.textContent=s.role==='master'?'Painel do mestre':'Echos';}}catch(e){}})()</script>

  <main class="page-main page-main-echos">
    <section class="echos-hero">
      <div class="page-heading">
        <span class="section-label">// Manifestações residuais</span>
        <h1 class="page-title">Echos</h1>
      </div>
      <p class="echos-intro" id="echosIntro">Gerencie os Echos que você obteve derrotando monstros.</p>
    </section>

    <section class="echos-toolbar">
      <div class="echos-toolbar-row">
        <label class="echos-search">
          <span class="sr-only">Buscar Echo</span>
          <input type="search" id="echoSearch" class="form-input" placeholder="Buscar por nome, monstro ou raridade..." autocomplete="off" />
        </label>

        <div class="echos-filter-group">
          <label class="echos-filter">
            <span class="item-meta">Raridade</span>
            <select id="echoRarityFilter" class="form-input">
              <option value="all">Todas</option>
              <option value="comum">Comum</option>
              <option value="raro">Raro</option>
              <option value="epico">Épico</option>
              <option value="lendario">Lendário</option>
            </select>
          </label>

          <label class="echos-filter">
            <span class="item-meta">Ordenar</span>
            <select id="echoSortFilter" class="form-input">
              <option value="recent">Mais recentes</option>
              <option value="name">Nome</option>
              <option value="rank">Rank</option>
              <option value="rarity">Raridade</option>
            </select>
          </label>

          <label class="echos-filter" id="echoOwnerFilterWrap" hidden>
            <span class="item-meta">Dono</span>
            <select id="echoOwnerFilter" class="form-input">
              <option value="all">Todos os donos</option>
            </select>
          </label>
        </div>

        <span class="echos-count-badge" id="echoCountBadge">0 Echos</span>
      </div>
    </section>

    <section class="echos-grid" id="echosGrid" aria-live="polite">
      <p class="empty-msg echos-empty">Carregando Echos...</p>
    </section>
  </main>

  <div class="echo-modal-root app-modal-root" id="echoModalRoot" hidden>
    <div class="app-modal-backdrop" data-echo-modal-close="backdrop"></div>
    <section
      class="echo-modal-dialog app-modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="echoModalTitle"
      tabindex="-1"
    >
      <button type="button" class="app-modal-close" data-echo-modal-close="button" aria-label="Fechar detalhes do Echo">
        <span>&times;</span>
      </button>
      <div id="echoModalContent" class="echo-modal-content"></div>
    </section>
  </div>

  <script src="js/runtime-config.js?v=2026-05-04-mesa-realtime-1" defer></script>
  <script src="js/ui.js?v=2026-06-11-soul-notify-1" defer></script>
  <script src="js/api.js?v=2026-07-11-map-facade-1" defer></script>
  <script src="js/auth.js?v=2026-06-13-login-form-1" defer></script>
  <script src="js/echos-core.js?v=2026-06-14-echos-1" defer></script>
  <script src="js/echos-page.js?v=2026-06-14-echos-1" defer></script>
  <script src="js/echos-init.js?v=2026-06-14-echos-1" defer></script>
</body>
</html>
